name: infra-deploy-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - infra/**

pr: none

variables:
  - group: obs-overlay-shared
  - name: vmImage
    value: ubuntu-latest
  - name: infraTemplatePath
    value: infra/main.bicep
  - name: bicepPrefix
    value: obstg

stages:
  - stage: DeployInfra
    displayName: Deploy infrastructure with Bicep
    condition: and(succeeded(), ne(variables['azureServiceConnection'], ''), ne(variables['resourceGroup'], ''))
    jobs:
      - job: ProvisionInfra
        displayName: Preview and apply infrastructure changes
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Validate and preview Bicep changes
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                deploymentName="obs-telegram-overlay-$(Build.BuildId)"

                az bicep build --file "$(infraTemplatePath)"

                az deployment group what-if \
                  --name "${deploymentName}" \
                  --resource-group "$(resourceGroup)" \
                  --template-file "$(infraTemplatePath)" \
                  --parameters prefix="$(bicepPrefix)"

          - task: AzureCLI@2
            displayName: Apply Bicep deployment
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                deploymentName="obs-telegram-overlay-$(Build.BuildId)"

                az deployment group create \
                  --name "${deploymentName}" \
                  --resource-group "$(resourceGroup)" \
                  --template-file "$(infraTemplatePath)" \
                  --parameters prefix="$(bicepPrefix)" \
                  --output table

                storageAccountName=$(az deployment group show \
                  --resource-group "$(resourceGroup)" \
                  --name "${deploymentName}" \
                  --query properties.outputs.storageAccountName.value \
                  -o tsv)

                if [[ -z "$storageAccountName" ]]; then
                  echo "ERROR: storageAccountName output is empty in deployment ${deploymentName}."
                  exit 1
                fi

                echo "##vso[task.setvariable variable=resolvedStorageAccountName]$storageAccountName"

          - task: AzureCLI@2
            displayName: Enable static website hosting
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az storage account show \
                  --name "$(resolvedStorageAccountName)" \
                  --resource-group "$(resourceGroup)" >/dev/null

                az storage blob service-properties update \
                  --account-name "$(resolvedStorageAccountName)" \
                  --auth-mode login \
                  --static-website \
                  --index-document index.html \
                  --404-document 404.html
