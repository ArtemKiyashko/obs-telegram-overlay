name: infra-deploy-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - infra/**

pr: none

variables:
  - group: obs-overlay-shared
  - group: obs-overlay-infra
  - name: vmImage
    value: ubuntu-latest
  - name: infraTemplatePath
    value: infra/main.bicep

stages:
  - stage: DeployInfra
    displayName: Deploy infrastructure with Bicep
    condition: and(succeeded(), ne(variables['azureServiceConnection'], ''), ne(variables['resourceGroup'], ''))
    jobs:
      - deployment: ProvisionInfra
        displayName: Run what-if and apply infrastructure changes
        environment: production
        pool:
          vmImage: $(vmImage)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: Validate and preview Bicep changes
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      deploymentName="obs-telegram-overlay-$(Build.BuildId)"

                      az bicep build --file "$(infraTemplatePath)"

                      az deployment group what-if \
                        --name "${deploymentName}" \
                        --resource-group "$(resourceGroup)" \
                        --template-file "$(infraTemplatePath)" \
                        prefix="$(bicepPrefix)" \
                        location="$(location)"

                - task: AzureCLI@2
                  displayName: Apply Bicep deployment
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      deploymentName="obs-telegram-overlay-$(Build.BuildId)"

                      az deployment group create \
                        --name "${deploymentName}" \
                        --resource-group "$(resourceGroup)" \
                        --template-file "$(infraTemplatePath)" \
                        prefix="$(bicepPrefix)" \
                        location="$(location)" \
                        --output table
