name: bot-deploy-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - bot/*
      - bot/**

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - bot/*
      - bot/**

variables:
  - group: obs-overlay-shared
  - group: obs-overlay-bot
  - name: vmImage
    value: ubuntu-latest
  - name: dotnetVersion
    value: 8.0.x
  - name: botProjectPath
    value: bot/bot.csproj
  - name: botPublishDir
    value: $(Build.ArtifactStagingDirectory)/bot_publish
  - name: botPackagePath
    value: $(Build.ArtifactStagingDirectory)/bot.zip

stages:
  - stage: Validate
    displayName: Build and test bot
    jobs:
      - job: BuildTestBot
        displayName: Restore, build, and test bot
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self
            clean: true

          - task: UseDotNet@2
            displayName: Use .NET SDK $(dotnetVersion)
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - script: |
              dotnet restore $(botProjectPath)
              dotnet build $(botProjectPath) --configuration Release --no-restore
              dotnet test $(botProjectPath) --configuration Release --no-build
            displayName: Restore, build, and test bot

  - stage: DeployBot
    displayName: Deploy bot to Azure Function
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['azureServiceConnection'], ''), ne(variables['resourceGroup'], ''))
    jobs:
      - deployment: DeployFunction
        displayName: Deploy function app package
        environment: production
        pool:
          vmImage: $(vmImage)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: UseDotNet@2
                  displayName: Use .NET SDK $(dotnetVersion)
                  inputs:
                    packageType: sdk
                    version: $(dotnetVersion)

                - script: |
                    dotnet restore $(botProjectPath)
                    dotnet build $(botProjectPath) --configuration Release --no-restore
                    dotnet test $(botProjectPath) --configuration Release --no-build
                    dotnet publish $(botProjectPath) --configuration Release --output $(botPublishDir)
                  displayName: Build, test, and publish bot package

                - task: ArchiveFiles@2
                  displayName: Archive bot package
                  inputs:
                    rootFolderOrFile: $(botPublishDir)
                    includeRootFolder: false
                    archiveType: zip
                    archiveFile: $(botPackagePath)
                    replaceExistingArchive: true

                - task: AzureCLI@2
                  displayName: Resolve Function App name
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      overrideName='$(functionAppName)'
                      if [[ "$overrideName" == '$(functionAppName)' ]]; then
                        overrideName=''
                      fi

                      if [[ -n "$overrideName" ]]; then
                        resolvedName="$overrideName"
                        echo "Using functionAppName override: $resolvedName"
                      else
                        deploymentName=$(az deployment group list \
                          --resource-group "$(resourceGroup)" \
                          --query "[?properties.outputs.functionAppName.value!=null] | sort_by(@,&properties.timestamp)[-1].name" \
                          -o tsv)

                        if [[ -z "$deploymentName" ]]; then
                          echo "ERROR: Could not find an infrastructure deployment with functionAppName output in resource group $(resourceGroup)."
                          echo "Set variable functionAppName in obs-overlay-bot as override, or run infra pipeline first."
                          exit 1
                        fi

                        resolvedName=$(az deployment group show \
                          --resource-group "$(resourceGroup)" \
                          --name "$deploymentName" \
                          --query "properties.outputs.functionAppName.value" \
                          -o tsv)

                        if [[ -z "$resolvedName" ]]; then
                          echo "ERROR: functionAppName output is empty in deployment $deploymentName."
                          exit 1
                        fi

                        echo "Resolved function app from deployment $deploymentName: $resolvedName"
                      fi

                      echo "##vso[task.setvariable variable=resolvedFunctionAppName]$resolvedName"

                - task: AzureFunctionApp@2
                  displayName: Deploy Azure Function
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: functionAppLinux
                    appName: $(resolvedFunctionAppName)
                    package: $(botPackagePath)
                    runtimeStack: DOTNET-ISOLATED|8.0

                - task: AzureCLI@2
                  displayName: Configure optional app settings
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      settings=()
                      if [[ -n "$(telegramBotToken)" ]]; then
                        settings+=("Bot__TelegramBotToken=$(telegramBotToken)")
                      fi

                      if [[ -n "$(telegramManagementChatId)" ]]; then
                        settings+=("Bot__TelegramManagementChatId=$(telegramManagementChatId)")
                      fi

                      if [[ ${#settings[@]} -gt 0 ]]; then
                        az functionapp config appsettings set \
                          --resource-group "$(resourceGroup)" \
                          --name "$(resolvedFunctionAppName)" \
                          --settings "${settings[@]}"
                      else
                        echo "No optional Telegram settings provided. Skipping appsettings update."
                      fi
