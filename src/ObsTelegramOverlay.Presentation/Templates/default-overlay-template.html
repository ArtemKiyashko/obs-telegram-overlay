<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telegram OBS Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        color: #eef2ff;
        background: transparent !important;
      }
      .shell {
        padding: 20px;
      }
      .messages {
        display: grid;
        gap: 10px;
      }
      .audio-unlock {
        display: none;
        position: fixed;
        left: 20px;
        bottom: 20px;
        z-index: 1000;
        background: rgba(15, 23, 42, 0.86);
        border: 1px solid rgba(148, 163, 184, 0.45);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.35;
      }
      .audio-unlock.visible {
        display: block;
      }
      .audio-unlock button {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .message {
        backdrop-filter: blur(6px);
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 12px;
        padding: 10px 12px;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .message.fade-out {
        opacity: 0;
        transform: translateY(-4px);
      }
      .meta {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        opacity: 0.82;
        margin-bottom: 6px;
      }
      .sender {
        font-weight: 700;
      }
      .text {
        white-space: pre-wrap;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section id="messages" class="messages"></section>
    </main>
    <aside id="audio-unlock" class="audio-unlock" aria-live="polite">
      <div>Audio is blocked by autoplay policy.</div>
      <div>In OBS: right click Browser Source -> Interact -> click button once.</div>
      <button id="audio-unlock-button" type="button">Enable Audio</button>
    </aside>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
      const maxMessages = 20;
      const messagesRoot = document.getElementById('messages');
      const overlaySettings = window.__overlaySettings || {};
      const messageTtlMs = Math.max(1000, Number(overlaySettings.messageTtlSeconds || 10) * 1000);
      const fadeDurationMs = 600;
      const speechEngine = (overlaySettings.speechEngine || 'none').toLowerCase();
      const speechLang = overlaySettings.speechLang || 'ru-RU';
      const speechLangMode = (overlaySettings.speechLangMode || 'fixed').toLowerCase();
      const audioUnlockRoot = document.getElementById('audio-unlock');
      const audioUnlockButton = document.getElementById('audio-unlock-button');
      const isServerSideSpeech = speechEngine === 'local' || speechEngine === 'piper' || speechEngine === 'edge-tts';
      let speechQueue = Promise.resolve();
      let pendingSpeechBlobs = [];

      // AudioContext is the only reliable way to play audio in OBS Browser Source
      // with "Control audio via OBS" enabled AND to satisfy autoplay policy correctly.
      let audioCtx = null;

      const getAudioContext = () => {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      };

      const renderClock = (isoDate) => {
        const date = new Date(isoDate);
        if (Number.isNaN(date.getTime())) {
          return '';
        }
        return new Intl.DateTimeFormat('ru-RU', { hour: '2-digit', minute: '2-digit' }).format(date);
      };

      const renderSender = (msg) => {
        const sender = msg.sender || 'Unknown';
        if (typeof msg.chatId !== 'number') {
          return sender;
        }

        return `${sender} · ${msg.chatId}`;
      };

      const addMessage = (msg) => {
        const card = document.createElement('article');
        card.className = 'message';

        const meta = document.createElement('div');
        meta.className = 'meta';

        const sender = document.createElement('span');
        sender.className = 'sender';
        sender.textContent = renderSender(msg);

        const clock = document.createElement('span');
        clock.textContent = renderClock(msg.sentUtc);

        meta.appendChild(sender);
        meta.appendChild(clock);

        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = msg.text || '';

        card.appendChild(meta);
        card.appendChild(text);

        messagesRoot.prepend(card);
        queueFadeOut(card);

        while (messagesRoot.children.length > maxMessages) {
          messagesRoot.removeChild(messagesRoot.lastChild);
        }
      };

      const speakMessage = (msg) => {
        if (speechEngine === 'none') {
          return;
        }

        const text = (msg.text || '').trim();
        if (!text) {
          return;
        }

        const lang = resolveSpeechLang(text);

        if (isServerSideSpeech) {
          enqueueSpeech(async () => {
            const response = await fetch('/api/speech', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text, lang })
            });

            if (!response.ok) {
              console.warn('Server speech request failed', response.status);
              return;
            }

            const blob = await response.blob();
            if (blob.size === 0) {
              console.error('Speech blob is empty');
              return;
            }
            await playAudioBlob(blob);
          });
          return;
        }

        if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
          return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        window.speechSynthesis.speak(utterance);
      };

      const resolveSpeechLang = (text) => {
        if (speechLangMode === 'auto') {
          return /[\u0400-\u04FF]/.test(text) ? 'ru-RU' : 'en-US';
        }

        return speechLang;
      };

      const enqueueSpeech = (task) => {
        speechQueue = speechQueue
          .then(task)
          .catch((error) => {
            console.error('Speech queue error', error);
          });
      };

      const showAudioUnlockPrompt = () => {
        if (audioUnlockRoot) {
          audioUnlockRoot.classList.add('visible');
        }
      };

      const hideAudioUnlockPrompt = () => {
        if (audioUnlockRoot) {
          audioUnlockRoot.classList.remove('visible');
        }
      };

      const flushPendingSpeech = () => {
        if (!pendingSpeechBlobs.length) {
          return;
        }

        const queued = pendingSpeechBlobs;
        pendingSpeechBlobs = [];

        queued.forEach((blob) => {
          enqueueSpeech(() => playAudioBlob(blob));
        });
      };

      const unlockAudio = async () => {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }
        hideAudioUnlockPrompt();
        flushPendingSpeech();
      };

      if (audioUnlockButton) {
        audioUnlockButton.addEventListener('click', unlockAudio);
      }

      const playAudioBlob = async (blob) => {
        const ctx = getAudioContext();

        // AudioContext starts suspended until a user gesture resumes it.
        if (ctx.state === 'suspended') {
          pendingSpeechBlobs.push(blob);
          showAudioUnlockPrompt();
          return;
        }

        try {
          const arrayBuffer = await blob.arrayBuffer();
          const audioBuffer = await ctx.decodeAudioData(arrayBuffer);

          await new Promise((resolve, reject) => {
            const source = ctx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(ctx.destination);
            source.onended = resolve;
            source.onerror = reject;
            source.start();
          });
        } catch (error) {
          console.error('Audio playback error', error);
        }
      };

      const queueFadeOut = (card) => {
        setTimeout(() => {
          card.classList.add('fade-out');
          setTimeout(() => {
            card.remove();
          }, fadeDurationMs);
        }, messageTtlMs);
      };

      const hubUrl = `${window.location.origin}/hubs/overlay`;
      const connection = new signalR.HubConnectionBuilder()
        .withUrl(hubUrl)
        .withAutomaticReconnect()
        .build();

      connection.on('overlay-snapshot', (items) => {
        messagesRoot.innerHTML = '';
        (items || []).forEach(addMessage);
      });

      connection.on('overlay-message', (msg) => {
        addMessage(msg);
        speakMessage(msg);
      });

      connection.start().catch((error) => {
        console.error('SignalR connection failed', error);
      });
    </script>
  </body>
</html>
