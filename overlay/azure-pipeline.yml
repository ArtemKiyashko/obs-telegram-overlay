name: overlay-deploy-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - overlay/*
      - overlay/**

pr: none

variables:
  - group: obs-overlay-shared
  - name: vmImage
    value: ubuntu-latest
  - name: nodeVersion
    value: 20.x

stages:
  - stage: DeployOverlay
    displayName: Build and publish overlay assets
    condition: and(succeeded(), ne(variables['azureServiceConnection'], ''), ne(variables['resourceGroup'], ''))
    jobs:
      - job: PublishOverlayAssets
        displayName: Build overlay and upload static files
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              npm ci
              npm run lint
              npm run build
            displayName: Lint and build overlay
            workingDirectory: overlay

          - task: AzureCLI@2
            displayName: Resolve Storage Account name
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                overrideName='$(storageAccountName)'
                if [[ "$overrideName" == '$(storageAccountName)' ]]; then
                  overrideName=''
                fi

                if [[ -n "$overrideName" ]]; then
                  resolvedName="$overrideName"
                  echo "Using storageAccountName override: $resolvedName"
                else
                  deploymentName=$(az deployment group list \
                    --resource-group "$(resourceGroup)" \
                    --query "[?properties.outputs.storageAccountName.value!=null] | sort_by(@,&properties.timestamp)[-1].name" \
                    -o tsv)

                  if [[ -z "$deploymentName" ]]; then
                    echo "ERROR: Could not find an infrastructure deployment with storageAccountName output in resource group $(resourceGroup)."
                    echo "Set variable storageAccountName as override, or run infra pipeline first."
                    exit 1
                  fi

                  resolvedName=$(az deployment group show \
                    --resource-group "$(resourceGroup)" \
                    --name "$deploymentName" \
                    --query "properties.outputs.storageAccountName.value" \
                    -o tsv)

                  if [[ -z "$resolvedName" ]]; then
                    echo "ERROR: storageAccountName output is empty in deployment $deploymentName."
                    exit 1
                  fi

                  echo "Resolved storage account from deployment $deploymentName: $resolvedName"
                fi

                echo "##vso[task.setvariable variable=resolvedStorageAccountName]$resolvedName"

          - task: AzureCLI@2
            displayName: Publish overlay assets and template
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az storage account show --name "$(resolvedStorageAccountName)" --resource-group "$(resourceGroup)" >/dev/null

                az storage blob upload \
                  --account-name "$(resolvedStorageAccountName)" \
                  --auth-mode login \
                  --container-name '$web' \
                  --name 'overlay-assets/overlay.js' \
                  --file 'overlay/dist/overlay.js' \
                  --overwrite true

                az storage blob upload \
                  --account-name "$(resolvedStorageAccountName)" \
                  --auth-mode login \
                  --container-name '$web' \
                  --name 'overlay-assets/overlay.css' \
                  --file 'overlay/dist/overlay.css' \
                  --overwrite true

                az storage blob upload \
                  --account-name "$(resolvedStorageAccountName)" \
                  --auth-mode login \
                  --container-name '$web' \
                  --name 'overlay-assets/overlay-template.html' \
                  --file 'overlay/dist/overlay-template.html' \
                  --overwrite true

                az storage blob upload \
                  --account-name "$(resolvedStorageAccountName)" \
                  --auth-mode login \
                  --container-name '$web' \
                  --name '404.html' \
                  --file 'overlay/dist/index.html' \
                  --overwrite true
