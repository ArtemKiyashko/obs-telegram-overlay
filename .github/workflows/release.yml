name: release

on:
  push:
    tags:
      - "v1.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64, osx-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ObsTelegramOverlay.slnx

      - name: Publish
        run: >
          dotnet publish src/ObsTelegramOverlay.Presentation/ObsTelegramOverlay.Presentation.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-telegram-overlay-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
