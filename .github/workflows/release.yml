name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64, osx-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ObsTelegramOverlay.slnx

      - name: Publish
        run: >
          dotnet publish src/ObsTelegramOverlay.Presentation/ObsTelegramOverlay.Presentation.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-telegram-overlay-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Archive artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundles

          for rid in linux-x64 osx-arm64; do
            src="release-artifacts/obs-telegram-overlay-${rid}"
            tar -C "$src" -czf "release-bundles/obs-telegram-overlay-${GITHUB_REF_NAME}-${rid}.tar.gz" .
          done

          src="release-artifacts/obs-telegram-overlay-win-x64"
          (cd "$src" && zip -r "../../release-bundles/obs-telegram-overlay-${GITHUB_REF_NAME}-win-x64.zip" .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-bundles/*
